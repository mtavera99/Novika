name: pruebas

# La bateria no necesita credenciales, no sale a la red y no toca Meta.
# Por eso puede correr en cada push sin riesgo de escribirle a un cliente.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar que no hay secretos en el repositorio
        run: |
          # Un .env commiteado es la forma mas facil de publicar un token.
          if git ls-files | grep -E '^\.env$|^\.env\.' | grep -v '\.env\.example'; then
            echo "Hay un archivo .env en el repositorio. Los secretos van en el entorno."
            exit 1
          fi
          echo "Sin archivos .env en el repositorio."

      - name: Pruebas
        run: npm test
