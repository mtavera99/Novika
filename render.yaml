# ==========================================================================
# Despliegue de NOVIKA en Render
#
# Servicio, disco y variables propios de NOVIKA. Nada compartido con ningun
# otro proyecto: ni el servicio, ni el disco, ni las variables.
#
# Las variables marcadas con sync:false NO se escriben aqui: Render las pide
# en el panel la primera vez. Este archivo es publico; los secretos no.
#
# Para usarlo: Render -> New -> Blueprint -> apuntar a este repositorio.
# ==========================================================================

services:
  - type: web
    name: novika-bot
    runtime: node
    plan: starter # El plan gratuito duerme, y despertar tarda ~50 s: el
                  # primer mensaje del cliente se pierde. Son los 7 USD mas
                  # rentables del proyecto.
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health

    # Un disco obliga a una sola instancia. Es explicito para que nadie lo
    # suba sin darse cuenta: con dos instancias, cada una tendria su propia
    # memoria de ids ya vistos y el antiduplicados dejaria de servir.
    numInstances: 1

    disk:
      # EL SISTEMA DE ARCHIVOS DE UN WEB SERVICE ES EFIMERO. Sin este disco,
      # cada despliegue y cada reinicio borra el diario de eventos y la
      # memoria de ids ya vistos; el antiduplicados deja de funcionar y el
      # reintento de Meta -que llega hasta 36 horas despues- se procesa como
      # un mensaje nuevo.
      #
      # Declarar DATA_DIR=/var/data NO crea este disco. Si el disco no esta
      # montado, /var/data es una carpeta corriente que desaparece en el
      # siguiente despliegue, con un nombre que tranquiliza. El servidor lo
      # COMPRUEBA al arrancar y lo publica en /health como
      # "persistencia": "efimera".
      #
      # Lo que cuesta tener disco, y conviene saberlo:
      #   - desactiva los despliegues sin interrupcion (hueco de segundos en
      #     cada deploy; Meta reintenta, y el antiduplicados cubre el resto);
      #   - una sola instancia, sin escalado horizontal;
      #   - no esta disponible durante buildCommand ni preDeployCommand.
      #
      # Se puede ampliar, no reducir: empezar en 1 GB.
      # Disco propio de NOVIKA, no compartido con ningun otro servicio.
      name: novika-datos
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: DATA_DIR
        value: /var/data

      - key: GRAPH_VERSION
        value: v21.0

      - key: ZONA_HORARIA
        value: America/Bogota

      - key: LOG_NIVEL
        value: info

      - key: LOG_PII
        value: "0"

      # Interruptor maestro. En 0, NOVIKA recibe y registra pero no le
      # escribe a nadie. Se enciende cuando haya guion comercial aprobado.
      - key: RESPUESTA_AUTOMATICA
        value: "0"

      # --- Secretos: se introducen en el panel de Render, no aqui ---
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false
      - key: PANEL_TOKEN
        sync: false
      - key: OWNER_WHATSAPP
        sync: false
